[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-telegram-bridge"
version = "0.14.4"
description = "Control an existing interactive Claude Code session from Telegram."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Claude Telegram Bridge contributors" }
]
keywords = ["claude", "telegram", "tmux", "bridge", "automation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Communications :: Chat",
  "Topic :: Software Development"
]
dependencies = ["Pillow>=10"]

[project.urls]
Homepage = "https://github.com/ssamssae/claude-telegram-bridge"
Repository = "https://github.com/ssamssae/claude-telegram-bridge"
Releases = "https://github.com/ssamssae/claude-telegram-bridge/releases"
Issues = "https://github.com/ssamssae/claude-telegram-bridge/issues"

[project.scripts]
claude-telegram-bridge = "bridge_setup:main"
claude-telegram-bridge-watchdog = "bridge_watchdog:main"

[tool.setuptools]
py-modules = [
  "agent_control_adapters", "agent_control_protocol", "bridge_flow_progress",
  "bridge_public_text",
  "bridge_i18n",
  "terminal_turn_mirror",
  "bridge_setup",
  "bridge_watchdog",
  "claude_telegram_bridge",
  "claude_repl_host_windows",
  "codex_repl_host_windows",
]
